name: oos_detection
services:
  backend:
    container_name: oos_detection-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    env_file: ./backend/.env
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./shelf_analyzer:/usr/src/app/shelf_analyzer
      - ./weights:/usr/src/app/weights:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 1h
      timeout: 5s
      retries: 12
      start_period: 30s
      start_interval: 5s
    develop:
      watch:
        # sync only — Flask's debug reloader handles restarts inside the container
        - action: sync
          path: ./backend/app
          target: /usr/src/app/app
          ignore:
            - "**/__pycache__/**"
            - "**/*.pyc"
            - "**/*.pyo"
            - "**/.DS_Store"
            - "**/.pytest_cache/**"
            - "**/.mypy_cache/**"
            - "**/.venv/**"
            - "**/venv/**"
            - "**/.git/**"
            - "**/.idea/**"
            - "**/.vscode/**"
        # sync+restart — shelf_analyzer is lazily imported so Flask won't watch it
        - action: sync+restart
          path: ./shelf_analyzer
          target: /usr/src/app/shelf_analyzer
          ignore:
            - "**/__pycache__/**"
            - "**/*.pyc"
            - "**/.DS_Store"
  db:
    container_name: pg-oos_detection
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oos_detection
      POSTGRES_USER: oos_detection
      POSTGRES_PASSWORD: oos_detection_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - oos_detection-vol:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oos_detection"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    container_name: oos_detection-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: ./frontend/.env
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./frontend/src
          target: /usr/src/app/src
          ignore:
            - "**/.git/**"
            - "**/.DS_Store"
            - "**/.idea/**"
            - "**/.vscode/**"
        - action: rebuild
          path: ./frontend/package.json

volumes:
  oos_detection-vol:
