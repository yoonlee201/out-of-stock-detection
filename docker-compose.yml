name: oos_detection
services:
  backend:
    container_name: oos_detection-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Secrets must be injected as environment variables in production —
    # never from a file on disk. On EC2 use an .env file only for local
    # testing; in real production use AWS Secrets Manager or ECS task defs.
    env_file: backend/.env
    restart: unless-stopped
    ports:
      # Mapping the EC2's public HTTP port (80) to Flask's port (5000).
      - "80:5000"
    environment:
      # Gunicorn 25.x control server needs a writable home directory.
      # appuser's home is /nonexistent (intentionally absent), so redirect to /tmp.
      HOME: /tmp
      HF_HOME: /usr/src/app/.cache/huggingface
    volumes:
      - ./weights:/usr/src/app/weights
      - hf_cache:/usr/src/app/.cache/huggingface
    # Use Gunicorn in production — the Flask dev server is single-threaded
    # and not hardened. 2 workers handle concurrent requests; raise for
    # multi-core instances. 300 s timeout covers model download + Qwen VL inference.
    command: >
      gunicorn "app.main:app"
      --bind 0.0.0.0:5000
      --workers 1
      --threads 4
      --timeout 300
      --worker-tmp-dir /dev/shm
      --access-logfile -
      --error-logfile -

volumes:
  hf_cache:
